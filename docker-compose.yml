services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jagobahasa_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      SESSION_DRIVER: database
      CACHE_STORE: database
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
    volumes:
      # Simpan file upload materi PDF/Audio agar tidak hilang saat container di-rebuild
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jagobahasa_net

  nginx:
    image: nginx:1.27-alpine
    container_name: jagobahasa_nginx
    restart: unless-stopped
    ports:
      # Ubah ke "80:80" saat deploy di VPS produksi, atau "8080:80" untuk uji coba lokal
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - storage_data:/var/www/html/public/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - jagobahasa_net

  db:
    image: mariadb:10.11
    container_name: jagobahasa_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-jagobahasa}
      MARIADB_USER: ${DB_USERNAME:-jagobahasa_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-rahasia_kuat_ganti_ini}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_rahasia_ganti_ini}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jagobahasa_net

volumes:
  mariadb_data:
  storage_data:

networks:
  jagobahasa_net:
    driver: bridge